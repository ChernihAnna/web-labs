
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Таблица случайных цветов</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }

        table {
            margin: 30px auto;
            border-collapse: collapse;
        }

        td {
            width: 100px;
            height: 60px;
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Таблица случайных цветов</h1>

    <table id="colorTable"></table>

    <button onclick="generateTable()">Создать новую таблицу</button>

    <script>
        function randomColor() {
            let r = Math.round(255 * Math.random()).toString(16).padStart(2, '0');
            let g = Math.round(255 * Math.random()).toString(16).padStart(2, '0');
            let b = Math.round(255 * Math.random()).toString(16).padStart(2, '0');

            return "#" + r + g + b;
        }

        function generateTable() {
            const table = document.getElementById("colorTable");
            table.innerHTML = "";

            for (let i = 0; i < 5; i++) {
                const row = table.insertRow();

                for (let j = 0; j < 5; j++) {
                    const cell = row.insertCell();
                    const color = randomColor();

                    cell.style.backgroundColor = color;
                    cell.textContent = color;
                }
            }
        }

        generateTable();
    </script>

</body>
</html>
