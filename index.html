
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вычисление площади прямоугольника</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 35px;
            border-radius: 16px;
            width: 350px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h2 {
            text-align: center;
            color: #26334a;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            border: 1px solid #ccd2dc;
            border-radius: 7px;
            font-size: 16px;
        }

        input[type="text"]:last-of-type {
            background: #edf3ff;
            cursor: pointer;
        }

        .hint {
            color: #777;
            font-size: 13px;
            margin-top: 8px;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>Площадь прямоугольника</h2>

    <form name="form1">

        <label>Длина прямоугольника:</label>
        <input type="number" name="length" step="any"
               placeholder="Введите длину" required>

        <label>Ширина прямоугольника:</label>
        <input type="number" name="width" step="any"
               placeholder="Введите ширину" required>

        <label>Площадь прямоугольника:</label>
        <input type="text" name="result" readonly
               placeholder="Нажмите сюда для расчёта"
               onclick="calculateArea()">

        <p class="hint">Нажмите на последнее поле, чтобы вычислить площадь.</p>

    </form>
</div>

<script>
    function calculateArea() {
        let length = Number(document.form1.length.value);
        let width = Number(document.form1.width.value);

        if (length <= 0 || width <= 0 ||
            document.form1.length.value === "" ||
            document.form1.width.value === "") {
            alert("Введите положительные значения длины и ширины!");
            return;
        }

        let area = length * width;

        document.form1.result.value = area;
    }
</script>

</body>
</html>
